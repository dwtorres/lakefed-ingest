# Databricks asset bundle for lakefed_cursor: cursor-only ingestion that sweeps many tables per job
# task on cluster compute, with control / checkpoint / telemetry state in Lakebase (schema lakefed_cursor).
# Own names (constitution IX): no resource reuses a lakefed_ingest or edp name; scripts/validate.sh checks.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lakefed_cursor

include:
  - resources/*.yml

# Variable declarations. Defaults suit most deployments; override per target.
variables:
  # Compute (warehouse-free; jobs run on job clusters). The sweep is DRIVER-bound — per-table MERGE
  # planning + Delta commits run on the driver — so size the driver up and keep workers modest.
  # Defaults are Azure node types; override per target. Note: the defaults need ~32 cores (16-core
  # driver + 2 x 8-core workers); a subscription with a small vCPU quota must use smaller nodes or
  # raise the quota first.
  node_type_id:
    description: Worker (and setup single-node) node type.
    default: Standard_D8ds_v5
  driver_node_type_id:
    description: Driver node type for the ingestion job (driver-bound; size this up first).
    default: Standard_D16ds_v5
  num_workers:
    description: Worker count for the ingestion job cluster.
    default: 2
  # State (Lakebase) and credentials.
  lakebase_instance:
    description: Lakebase instance holding control, checkpoint, and telemetry state.
    default: lakefed-cursor
  lakebase_capacity:
    description: Lakebase instance size (CU_1, CU_2, CU_4 or CU_8). Size up for collections of hundreds of thousands of tables, or many collections sweeping at once.
    default: CU_1
  lakebase_database:
    description: Postgres database on the Lakebase instance.
    default: databricks_postgres
  lakebase_catalog:
    description: Unity Catalog catalog the Lakebase database is registered as (for DBSQL monitoring).
    default: lakefed_cursor_lakebase
  secret_scope:
    description: Secret scope holding per-database source credentials (may be Azure Key Vault-backed).
    default: lakefed-cursor
  # Defaults of the ingestion job's tuning parameters (resources/lakefed_cursor.yml explains each); a
  # run can still override them.
  parallelism:
    description: Units of query work running at once in one run.
    default: "32"
  trust_server_certificate:
    description: Trust the source's TLS certificate without validating it (production false).
    default: "true"
  max_seeds_per_run:
    description: Seeds per run ("0" = no limit).
    default: "0"
  freshness_interval_s:
    description: Seconds between freshness writes for unchanged tables already at the current version ("0" = every run).
    default: "0"
  max_queries_per_source:
    description: Concurrent queries per source server across all runs, shared between them (at least 1 per run; see README "Concurrency"; "0" = no cap).
    default: "0"
  detection_chunk:
    description: Tables per batched change-detection query.
    default: "200"
  cursor_lookback_s:
    description: Seconds a temporal cursor increment starts below the checkpoint (a control row's cursor_lookback_s overrides it).
    default: "3600"
  cursor_skew_s:
    description: Seconds the temporal high watermark may exceed the source clock before it is capped.
    default: "300"
  table_retries:
    description: Extra attempts per table after a transient source error, in the same run ("0" = off).
    default: "0"
  table_retry_budget:
    description: Table retries in the whole run; once spent, failures fail at once.
    default: "20"

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://company-dev.cloud.databricks.com/

  devtest:
    # Live devtest workspace (quickstart.md, step 8). Same development mode as dev.
    mode: development
    workspace:
      host: https://dbc-8e058692-373e.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://company-prd.cloud.databricks.com/
      # Use fixed location to make sure we only have a single copy.
      # If this path results in an error, please make sure you have a recent version of the CLI installed.
      root_path: /Workspace/${bundle.name}
